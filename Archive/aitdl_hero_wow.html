
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.hero {
  position: relative;
  min-height: 520px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 24px;
  overflow: hidden;
  background: #F8F7F4;
  font-family: var(--font-sans);
}

/* Binary rain */
.binary-rain {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.b-col {
  position: absolute;
  font-family: 'Courier New', monospace;
  font-size: 10px;
  color: #FF6B35;
  opacity: 0;
  writing-mode: vertical-rl;
  letter-spacing: 4px;
  animation: bRain linear infinite;
  user-select: none;
}
@keyframes bRain {
  0%   { opacity: 0; top: -20%; }
  10%  { opacity: 0.06; }
  90%  { opacity: 0.06; }
  100% { opacity: 0; top: 110%; }
}

/* Particles */
.particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  animation: float ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0) scale(1); opacity: 0.4; }
  50%      { transform: translateY(-20px) scale(1.2); opacity: 0.8; }
}

/* Grid overlay */
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,107,53,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,107,53,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
}

/* Content */
.hero-content {
  position: relative;
  z-index: 2;
  max-width: 800px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #FF6B35;
  border: 1px solid #FF6B3540;
  padding: 5px 14px;
  border-radius: 99px;
  margin-bottom: 24px;
  background: #FF6B3508;
  animation: badgePulse 2s ease-in-out infinite;
}
@keyframes badgePulse {
  0%,100% { box-shadow: 0 0 0 0 #FF6B3520; }
  50%      { box-shadow: 0 0 0 8px #FF6B3500; }
}

.hero-title {
  font-size: clamp(36px, 6vw, 64px);
  font-weight: 900;
  line-height: 1.1;
  color: #1A1A2E;
  margin-bottom: 8px;
  font-family: var(--font-sans);
}
.hero-title .orange {
  color: #FF6B35;
  position: relative;
}
/* Underline sweep */
.hero-title .orange::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #FF6B35, #E84C1E);
  border-radius: 2px;
  transform: scaleX(0);
  transform-origin: left;
  animation: underlineSweep 0.8s ease 0.5s forwards;
}
@keyframes underlineSweep {
  to { transform: scaleX(1); }
}

.hero-sub {
  font-size: 15px;
  color: #666;
  line-height: 1.7;
  margin: 20px auto 32px;
  max-width: 520px;
}

/* Stats */
.stats-row {
  display: flex;
  gap: 32px;
  justify-content: center;
  margin-bottom: 36px;
  flex-wrap: wrap;
}
.stat-item {
  text-align: center;
}
.stat-num {
  font-size: 28px;
  font-weight: 900;
  color: #1A1A2E;
  font-family: 'Arial Black', Arial;
  line-height: 1;
}
.stat-num span { color: #FF6B35; }
.stat-label {
  font-size: 9px;
  color: #999;
  letter-spacing: 2px;
  font-weight: 600;
  text-transform: uppercase;
  margin-top: 2px;
}

/* Buttons */
.btn-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn-primary {
  padding: 14px 32px;
  background: #FF6B35;
  color: white;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 1.5px;
  border: none;
  border-radius: 99px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s;
  box-shadow: 0 4px 20px #FF6B3540;
  animation: btnGlow 2s ease-in-out infinite;
}
@keyframes btnGlow {
  0%,100% { box-shadow: 0 4px 20px #FF6B3540; }
  50%      { box-shadow: 0 4px 32px #FF6B3570; }
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px #FF6B3560;
}
.btn-secondary {
  padding: 14px 32px;
  background: transparent;
  color: #1A1A2E;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 1px;
  border: 1.5px solid #1A1A2E30;
  border-radius: 99px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s;
}
.btn-secondary:hover {
  border-color: #FF6B35;
  color: #FF6B35;
  transform: translateY(-2px);
}

/* Scroll indicator */
.scroll-ind {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0.4;
  animation: scrollBounce 1.5s ease-in-out infinite;
  z-index: 2;
}
@keyframes scrollBounce {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50%      { transform: translateX(-50%) translateY(6px); }
}
.scroll-line {
  width: 1px;
  height: 24px;
  background: linear-gradient(#FF6B35, transparent);
}
</style>

<div>
<div class="hero" id="hero">

  <!-- Binary rain -->
  <div class="binary-rain" id="bRain"></div>

  <!-- Content -->
  <div class="hero-content">

    <!-- Badge -->
    <div class="badge">
      🇮🇳 INDIA'S NO. 1 AI COMMAND CENTER
    </div>

    <!-- Title -->
    <div class="hero-title">
      Right AI Tool<br>
      <span class="orange">At The Right Time</span>
    </div>

    <!-- Subtitle -->
    <p class="hero-sub">
      Command, Control, and Scale your AI potential with India's leading AI Command Center. Built for JEE · NEET · UPSC · and beyond.
    </p>

    <!-- Stats counter -->
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-num"><span id="s1">0</span>+</div>
        <div class="stat-label">AI Tools</div>
      </div>
      <div class="stat-item">
        <div class="stat-num"><span id="s2">0</span>+</div>
        <div class="stat-label">Students</div>
      </div>
      <div class="stat-item">
        <div class="stat-num"><span id="s3">0</span>%</div>
        <div class="stat-label">Free Tools</div>
      </div>
      <div class="stat-item">
        <div class="stat-num"><span id="s4">0</span></div>
        <div class="stat-label">Languages</div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
      <a class="btn-primary" href="#tools">
        ⚡ EXPLORE PLATFORM
      </a>
      <a class="btn-secondary" href="/about">
        LEARN MORE →
      </a>
    </div>

  </div>

  <!-- Scroll indicator -->
  <div class="scroll-ind">
    <div class="scroll-line"></div>
    <span style="font-size:8px;letter-spacing:2px;color:#FF6B35;">SCROLL</span>
  </div>

</div>
</div>

<script>
// Binary rain
var rain = document.getElementById('bRain');
for (var i = 0; i < 12; i++) {
  var col = document.createElement('div');
  col.className = 'b-col';
  col.style.left = (Math.random() * 100) + '%';
  col.style.animationDuration = (4 + Math.random() * 6) + 's';
  col.style.animationDelay = (Math.random() * 5) + 's';
  col.style.fontSize = (8 + Math.random() * 4) + 'px';
  var str = '';
  for (var j = 0; j < 30; j++) {
    str += (Math.random() > 0.5 ? '1' : '0') + '\n';
  }
  col.textContent = str;
  rain.appendChild(col);
}

// Particles
var hero = document.getElementById('hero');
var colors = ['#FF6B35','#E84C1E','#FF8C5A','#1A1A2E'];
for (var p = 0; p < 14; p++) {
  var dot = document.createElement('div');
  dot.className = 'particle';
  var size = 3 + Math.random() * 6;
  dot.style.cssText = [
    'width:'+size+'px',
    'height:'+size+'px',
    'left:'+(Math.random()*100)+'%',
    'top:'+(Math.random()*100)+'%',
    'background:'+colors[Math.floor(Math.random()*colors.length)],
    'animation-duration:'+(3+Math.random()*4)+'s',
    'animation-delay:'+(Math.random()*3)+'s',
    'opacity:0.3',
  ].join(';');
  hero.appendChild(dot);
}

// Counter animation
function countUp(id, target, duration, suffix) {
  var el = document.getElementById(id);
  if (!el) return;
  var start = 0;
  var step = target / (duration / 16);
  var timer = setInterval(function() {
    start += step;
    if (start >= target) {
      start = target;
      clearInterval(timer);
    }
    el.textContent = Math.floor(start) + (suffix||'');
  }, 16);
}

setTimeout(function() {
  countUp('s1', 178, 1200);
  countUp('s2', 8506, 1500);
  countUp('s3', 100, 800);
  countUp('s4', 22, 600);
}, 400);
</script>
