name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        run: |
          echo "Deploying to aitdl.com"

      - name: Send deploy log to Firestore
        if: success()
        run: |
          curl -s -X POST ${{ secrets.FIREBASE_LOG_URL }} \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.FIREBASE_ADMIN_TOKEN }}" \
            -d "{\"branch\":\"main\",\"status\":\"success\",\"commit\":\"$GITHUB_SHA\"}"
